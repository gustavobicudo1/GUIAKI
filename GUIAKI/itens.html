<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guiaki - Cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <nav class="menu-principal">
            <a href="index.html" class="link-home">HOME</a>
            <a href="cardapio.html">CARDAPIO</a>
            <a href="#">PEDIDO</a>
            <a href="#">AVALIAÇÃO</a>
            <a href="#">CARRINHO</a>
            <div class="caixa-pesquisa">
                <input type="text" placeholder="SEARCH...">
            </div>
        </nav>
        <a href="#" class="btn-contato">CONTATE_NOS</a>
    </header>

    <section class="cabecalho-cardapio">
        <div class="bloco-marca">
            <h1 class="titulo-guiaki">GUIAKI</h1>
            <div class="slogan">
                <p class="linha-1">O melhor</p>
                <p class="linha-2">SUSHI PARA</p>
                <p class="linha-3">V<img src="shushi.png" height="40">CÊ</p>
            </div>
        </div>

        <h2 class="titulo-pagina">NOSSO CARDÁPIO</h2>
    </section>

    <main class="lista-cardapio">

        <div class="card-produto">
            <div class="topo-card">
                <img src="salmao.png" alt="Salmão" class="foto-prato">
            </div>

            <div class="info-prato">
                <h3>SALMÃO</h3>
                <span class="unidade">(8 UNID)</span>
            </div>

            <button class="btn-comprar">
                <span>R$39,90</span>
                <span class="divisor"></span>
            </button>
        </div>

        <div class="card-produto">
            <div class="topo-card">
                <img src="acelga.png" alt="Acelga Maki" class="foto-prato">

            </div>

            <div class="info-prato">
                <div class="titulo-linha">
                    <h3>ACELGA<br>MAKI</h3>
                    <span class="unidade">(8 UNID)</span>
                </div>
                <p class="descricao">Acelga com salmão, cream cheese e cebolinha</p>
            </div>

            <button class="btn-comprar">
                <span>R$34,90</span>
                <span class="divisor"></span>
            </button>
        </div>

        <div class="card-produto">
            <div class="topo-card">
                <img src="hotroll.png" alt="Hot Roll Salmão" class="foto-prato">
            </div>

            <div class="info-prato">
                <div class="titulo-linha">
                    <h3>HOT ROLL<br>SALMÃO</h3>
                    <span class="unidade">(8 UNID)</span>
                </div>
                <p class="descricao">Enrolado de salmão á milanesa, molho tarê e cebolinha</p>
            </div>

            <button class="btn-comprar">
                <span>R$45,90</span>
                <span class="divisor"></span>
            </button>
        </div>

        <div class="card-produto">
            <div class="topo-card">>
                <img src="temaki.png" alt="Temaki Salmão" class="foto-prato">
            </div>

            <div class="info-prato">
                <h3>TEMAKI SALMÃO</h3>
                <span class="unidade unidade-centro">(1 UNID)</span>
            </div>

            <button class="btn-comprar">
                <span>R$39,90</span>
                <span class="divisor"></span>
            </button>
        </div>

    </main>

</body>
</html>
